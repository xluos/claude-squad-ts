name: Release to npm

# Fires when a `vX.Y.Z` tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
# Builds the dist bundle in a clean Ubuntu runner and publishes to the public
# npm registry via the package's Trusted Publisher configuration on npmjs.com
# — no long-lived NPM_TOKEN. GitHub mints a short-lived OIDC token at run
# time, npm verifies the configured (repo, workflow) pair, and the published
# artifact carries a provenance attestation users can verify.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          # OIDC trusted-publisher auth needs npm >= 11.5.1, which only
          # ships with Node 22.14.0+. Pinning to Node 24 (the version the
          # npm docs example uses) keeps us safely above that. Without
          # this, `npm publish` signs the provenance fine but falls back
          # to a non-OIDC publish path and the registry returns PUT 404.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        # Auth is OIDC via the package's Trusted Publisher entry (no
        # NODE_AUTH_TOKEN). `--provenance` is what triggers the OIDC
        # exchange with npm and emits the signed attestation.
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
